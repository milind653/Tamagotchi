<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff6f9c">
  <title>Offline | Tamagotchi</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #33283a; background: linear-gradient(160deg, #ffe8f0, #e3f2ff); }
    img { width: 120px; height: 120px; border-radius: 28px; box-shadow: 0 10px 24px #d9739d44; }
    h1 { margin: 20px 0 8px; font-size: 1.5rem; }
    p { margin: 0 auto 22px; max-width: 320px; line-height: 1.6; color: #6b5d75; }
    button { font: inherit; padding: 14px 28px; border: 0; border-radius: 16px; background: #d63a76; color: #fff; box-shadow: 0 4px 0 #a82557; min-height: 48px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Your pet is waiting patiently. Reconnect to the internet to look after it.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
